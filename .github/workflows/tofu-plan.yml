name: GitHub Org Automation Plan

on:
  pull_request_target:
    branches:
      - main
    paths:
      - "teams.yaml"
      - "repositories.yaml"

permissions:
  contents: read
  pull-requests: write # needed to comment on the PR

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub token
        env:
          # Repository secret covering only the permissions necessary to refresh
          # the state.
          TOFU_PLAN_TOKEN: ${{ secrets.TOFU_PLAN_TOKEN }}
        run: |
          if [ -z "$TOFU_PLAN_TOKEN" ]; then
            echo "::error::secret TOFU_PLAN_TOKEN is not available"
            exit 1
          fi

      # Reminder: this checks out the base branch because we run with
      # pull_request_target.
      - name: Check out base branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick changes to configuration
        # This script merges the PR FETCH_HEAD with main (which is our HEAD).
        # GitHub also offers a merge ref as well as variable pointing at the
        # merge commit SHA but those are known to sometimes be delayed or
        # outdated so merge the branches ourselves.
        # Once we've done that, we pick the two data file changes from the
        # merged tree to ensure the PR is unable to inject any foreign code to
        # try and extract any secrets.
        # Since the files are cat-ed from a blob any PRs trying to symlink to
        # /proc/self/environ or similar will fail as the cat will just write the
        # link target to a text file.
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head"
          if ! tree=$(git merge-tree --write-tree HEAD FETCH_HEAD); then
            echo "::error::PR does not cleanly merge"
            exit 1
          fi
          for f in teams.yaml repositories.yaml; do
            git cat-file blob "$tree:$f" > "$f"
          done

      # State lives on the "state" branch.
      - name: Check out state
        working-directory: automation
        run: |
          git fetch --depth=1 origin state:state
          git worktree add .state state

      - name: Set up tofu
        uses: opentofu/setup-opentofu@v2

      - name: Init tofu
        working-directory: automation
        run: tofu init -input=false

      - name: Run tofu plan
        id: plan
        working-directory: automation
        env:
          # github provider auth: the workflow token can't read org data,
          # so plan needs a token with org read access.
          GITHUB_TOKEN: ${{ secrets.TOFU_PLAN_TOKEN }}
        run: tofu plan -detailed-exitcode -no-color -input=false -out=plan.tfplan
        continue-on-error: true

      - name: Show tofu plan
        id: show
        working-directory: automation
        run: tofu show -no-color plan.tfplan
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          TF_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          TF_PLAN: ${{ steps.show.outputs.stdout}}
        with:
          script: |
            const plan = process.env.TF_PLAN;

            const marker = "<!-- tofu-plan -->";
            const status = { "0": "✅ No changes", "1": "❌ Failed", "2": "🔄 Changes pending" }[process.env.TF_EXITCODE] ?? "❓ Unknown";

            // GitHub comments are limited to 65536 characters.
            const maxLen = 60000;
            const trimmed = plan.length > maxLen
              ? "… (truncated, see workflow logs for the full plan)\n" + plan.slice(-maxLen)
              : plan;

            const body = `${marker}\n### Plan: ${status}\n` +
              `<details><summary>Show plan</summary>\n\n` +
              `\`\`\`terraform\n${trimmed}\n\`\`\`\n</details>\n\n` +
              `Workflow: [${process.env.GITHUB_RUN_ID}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === "Bot" && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Plan summary
        run: |
          if [ "$TF_EXITCODE" == 1 ]; then
            # Make sure the tofu error from stderr uses URL-encoded characters as
            # expected by the github annotation parser.
            error_message="${TF_STDERR//'%'/'%25'}"
            error_message="${error_message//$'\n'/'%0A'}"
            error_message="${error_message//$'\r'/'%0D'}"
            echo "::error title=Tofu Plan Failed::$error_message"
            exit 1
          else
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$TF_PLAN" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          TF_PLAN: ${{ steps.show.outputs.stdout }}
          TF_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          TF_STDERR: ${{ steps.plan.outputs.stderr }}
