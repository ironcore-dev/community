name: GitHub Org Automation Plan

on:
  pull_request:
    paths:
      - "automation/**"
      - "teams.yaml"
      - "repositories.yaml"
      - ".github/workflows/tofu-plan.yml"

permissions:
  contents: read
  pull-requests: write # needed to comment on the PR

# Make sure only a single plan runs at a time per PR
concurrency:
  group: tofu-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub token
        env:
          ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: |
          if [ -z "$ORG_GITHUB_TOKEN" ]; then
            echo "::error::secret ORG_GITHUB_TOKEN is not available (e.g. PR from a fork)"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v7

      # State lives on the "state" branch.
      - name: Check out state
        working-directory: automation
        run: |
          git fetch --depth=1 origin state:state
          git worktree add .state state

      - name: Set up tofu
        uses: opentofu/setup-opentofu@v2

      - name: Init tofu
        working-directory: automation
        run: tofu init -input=false

      - name: Run tofu plan
        id: plan
        working-directory: automation
        env:
          # github provider auth: the workflow token can't read org data,
          # so plan needs a PAT with org read access.
          GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: tofu plan -detailed-exitcode -no-color -input=false -out=plan.tfplan
        continue-on-error: true

      - name: Show tofu plan
        id: show
        working-directory: automation
        run: tofu show -no-color plan.tfplan
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          TF_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          TF_PLAN: ${{ steps.show.outputs.stdout}}
        with:
          script: |
            const fs = require("fs");
            const plan = process.env.TF_PLAN;

            const marker = "<!-- tofu-plan -->";
            const status = { "0": "✅ No changes", "1": "❌ Failed", "2": "🔄 Changes pending" }[process.env.TF_EXITCODE] ?? "❓ Unknown";

            // GitHub comments are limited to 65536 characters.
            const maxLen = 60000;
            const trimmed = plan.length > maxLen
              ? "… (truncated, see workflow logs for the full plan)\n" + plan.slice(-maxLen)
              : plan;

            const body = `${marker}\n### Plan: ${status}\n` +
              `<details><summary>Show plan</summary>\n\n` +
              `\`\`\`terraform\n${trimmed}\n\`\`\`\n</details>\n\n` +
              `Workflow: [${process.env.GITHUB_RUN_ID}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === "Bot" && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Plan summary
        run: |
          if [ $TF_EXITCODE == 1 ]; then
            # Make sure the tofu error from stderr uses URL-encoded characters as
            # expected by the github annotation parser.
            error_message="${TF_STDERR//'%'/'%25'}"
            error_message="${error_message//$'\n'/'%0A'}"
            error_message="${error_message//$'\r'/'%0D'}"
            echo "::error title=Tofu Plan Failed::$error_message"
            exit 1
          else
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$TF_PLAN" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          TF_PLAN: ${{ steps.show.outputs.stdout }}
          TF_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          TF_STDERR: ${{ steps.plan.outputs.stderr }}
