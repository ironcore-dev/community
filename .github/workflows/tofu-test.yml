name: GitHub Org Automation Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tofu Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2

      - name: Check tofu formatting
        working-directory: automation
        run: tofu fmt -check -recursive -diff

      - name: Init tofu
        working-directory: automation
        run: tofu init -input=false -backend=false

      - name: Validate tofu
        working-directory: automation
        run: tofu validate
        env:
          GITHUB_APP_ID: ${{ vars.TF_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_APP_INSTALLATION_ID }}
          GITHUB_APP_PEM_FILE: ${{ secrets.TF_APP_PEM_FILE }}
